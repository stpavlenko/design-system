name: Sync Design Tokens from Figma Export

on:
  push:
    paths:
      - 'src/tokens/tokens.tokens.json'
  workflow_dispatch:

jobs:
  sync-tokens:
    name: Parse Figma Export → tokens.json + tokens.css
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Parse Figma Variables JSON → tokens.json + tokens.css
        run: npm run tokens:sync

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/tokens/tokens.json src/tokens/tokens.css || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(tokens): sync design tokens from Figma export'
          title: 'Обновление дизайн-токенов из Figma'
          body: |
            Автоматическое обновление токенов из экспорта Figma Variables.

            **Как экспортировать переменные из Figma:**
            1. Открыть файл в Figma
            2. File → Export Variables → JSON
            3. Сохранить файл как `src/tokens/tokens.tokens.json`
            4. Закоммитить — этот workflow запустится автоматически

            **Изменённые файлы:**
            - `src/tokens/tokens.json` — канонический формат токенов
            - `src/tokens/tokens.css` — CSS custom properties

            > Проверьте визуальные изменения в Storybook перед мержем.
          branch: chore/sync-figma-tokens
          base: main
          labels: |
            tokens
            automated
